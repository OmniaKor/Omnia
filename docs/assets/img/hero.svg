<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420"
     role="img" aria-label="Omnia">
  <!--
    Placeholder masthead image. Concentric arcs echo the timer ring, so the
    header and the clock read as the same object seen twice.

    Everything meaningful sits inside the middle band (y 120–300). The header
    crops this with object-fit: cover, and the crop is deepest on wide desktop
    windows — keeping the composition central means it never clips a glyph.

    Self-contained tones rather than theme variables: an <img> cannot inherit
    the page's custom properties, and these sit correctly on both the cream and
    the near-black ground. Phase 7 swaps in real artwork.
  -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9dcc9"/>
      <stop offset="55%" stop-color="#dcc9b2"/>
      <stop offset="100%" stop-color="#c9a891"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a34a38" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#8f3a29" stop-opacity="0.20"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#ground)"/>

    <!-- The ring, cropped by the frame, centred on the safe band. -->
    <g fill="none" stroke="url(#fade)" stroke-linecap="round">
      <circle cx="900" cy="210" r="286" stroke-width="1.5" opacity="0.45"/>
      <circle cx="900" cy="210" r="212" stroke-width="2"/>
      <circle cx="900" cy="210" r="140" stroke-width="1.5" opacity="0.6"/>
      <path d="M900 70 a140 140 0 0 1 121 70" stroke="#8f3a29" stroke-width="6"/>
    </g>

    <!-- Wordmark and label, both well inside the safe band. -->
    <text x="80" y="232" font-family="'Noto Serif', Georgia, serif" font-size="104"
          font-weight="300" letter-spacing="-3" fill="#2a1c0e" fill-opacity="0.80">core</text>

    <path d="M80 268 H360" stroke="#2a1c0e" stroke-opacity="0.22" stroke-width="1"/>

    <text x="80" y="296" font-family="'IBM Plex Mono', monospace" font-size="18"
          letter-spacing="6.5" fill="#2a1c0e" fill-opacity="0.5">TEN MINUTES · DAILY</text>
  </g>
</svg>
