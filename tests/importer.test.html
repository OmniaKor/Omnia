<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Omnia — importer tests</title>
<style>
  body { font: 14px ui-monospace, monospace; padding: 1.5rem; line-height: 1.7; }
  .pass::before { content: "PASS  "; color: #1f6a42; }
  .fail::before { content: "FAIL  "; color: #8f2010; }
  .fail { color: #8f2010; }
  h1 { font: 600 16px ui-monospace, monospace; }
  #summary { margin-top: 1rem; font-weight: 600; }
</style>
</head>
<body>
<h1>Video importer</h1>
<div id="out"></div>
<div id="summary">running…</div>

<script type="module">
/*
  The importer talks to two APIs, so the parts worth testing are the ones that
  do not: link parsing, and what happens to a model response that is late,
  refused, truncated, or subtly wrong. `fetch` is replaced with a stub, which
  makes every one of those paths reachable without a key or a network.

  Open tests/importer.test.html over http (not file://) to run.
*/

const results = [];
const ok = (name, condition, detail = '') => results.push({ name, condition, detail });

async function throws(name, fn, matcher) {
  try {
    await fn();
    ok(name, false, 'did not throw');
  } catch (error) {
    const message = String(error.message || error);
    ok(name, matcher.test(message), `message was "${message}"`);
  }
}

const { parseVideoId, analyse, toRoutine, suggestedInterval } =
  await import('../app/assets/js/importer.js');

/* A stand-in catalog with the two shapes the importer uses. */
const exercises = [
  { id: 'Air_Bike', name: 'Air Bike' },
  { id: 'Crunches', name: 'Crunches' },
  { id: 'Plank', name: 'Plank' },
];
const catalog = { exercises, byId: new Map(exercises.map((e) => [e.id, e])) };

/** Stub one Anthropic response. */
function stub({ status = 200, body }) {
  window.fetch = async () => ({
    ok: status >= 200 && status < 300,
    status,
    json: async () => body,
  });
}

const answer = (payload, extra = {}) => ({
  // Thinking is on by default on the model this calls, so the text block is
  // deliberately NOT first here — reading content[0] must not pass.
  content: [
    { type: 'thinking', thinking: '' },
    { type: 'text', text: JSON.stringify(payload) },
  ],
  stop_reason: 'end_turn',
  ...extra,
});

/* ── 1. Link parsing ────────────────────────────────────────────────── */
{
  const cases = [
    ['https://www.youtube.com/watch?v=6UWcaE8rR68', '6UWcaE8rR68'],
    ['https://youtube.com/watch?v=6UWcaE8rR68&t=42s&list=PLxyz', '6UWcaE8rR68'],
    ['https://youtu.be/6UWcaE8rR68', '6UWcaE8rR68'],
    ['https://youtu.be/6UWcaE8rR68?t=90', '6UWcaE8rR68'],
    ['https://m.youtube.com/watch?v=6UWcaE8rR68', '6UWcaE8rR68'],
    ['https://www.youtube.com/shorts/6UWcaE8rR68', '6UWcaE8rR68'],
    ['https://www.youtube.com/embed/6UWcaE8rR68', '6UWcaE8rR68'],
    ['https://www.youtube-nocookie.com/embed/6UWcaE8rR68', '6UWcaE8rR68'],
    ['youtube.com/watch?v=6UWcaE8rR68', '6UWcaE8rR68'],
    ['  https://www.youtube.com/watch?v=6UWcaE8rR68  ', '6UWcaE8rR68'],
    ['6UWcaE8rR68', '6UWcaE8rR68'],
    ['https://vimeo.com/12345678', null],
    ['https://www.youtube.com/watch?v=tooshort', null],
    ['not a url at all', null],
    ['', null],
    [null, null],
  ];

  let bad = [];
  for (const [input, expected] of cases) {
    const got = parseVideoId(input);
    if (got !== expected) bad.push(`${JSON.stringify(input)} → ${got} (want ${expected})`);
  }
  ok(`parses ${cases.length} link shapes`, bad.length === 0, bad.join('; '));
}

/* ── 2. The text block is found past a thinking block ───────────────── */
{
  stub({ body: answer({
    found: true, name: 'Quick core', notes: '',
    items: [{ kind: 'exercise', name: 'Crunches', seconds: 45, catalogId: 'Crunches', cue: '' }],
  }) });

  const out = await analyse('text', catalog, 'k');
  ok('reads the text block, not content[0]', out.found && out.items.length === 1,
     JSON.stringify(out));
  ok('keeps the routine name', out.name === 'Quick core', out.name);
}

/* ── 3. A refusal is not a routine ──────────────────────────────────── */
{
  stub({ body: { content: [], stop_reason: 'refusal', stop_details: { category: 'other' } } });
  await throws('refusal is reported, not indexed into',
    () => analyse('text', catalog, 'k'), /declined/i);
}

/* ── 4. A truncated answer is not a routine ─────────────────────────── */
{
  stub({ body: { content: [{ type: 'text', text: '{"found":' }], stop_reason: 'max_tokens' } });
  await throws('truncation is caught before parsing',
    () => analyse('text', catalog, 'k'), /too long/i);
}

/* ── 5. HTTP failures say which one ─────────────────────────────────── */
{
  stub({ status: 401, body: { error: { message: 'invalid x-api-key' } } });
  await throws('401 blames the key', () => analyse('t', catalog, 'k'), /key was rejected/i);

  stub({ status: 429, body: { error: { message: 'rate limited' } } });
  await throws('429 says to wait', () => analyse('t', catalog, 'k'), /rate limited/i);
}

/* ── 6. An id the catalog does not have becomes the user's own ──────── */
{
  stub({ body: answer({
    found: true, name: 'X', notes: '',
    items: [
      { kind: 'exercise', name: 'Dragon Flag', seconds: 30, catalogId: 'Made_Up_Id', cue: 'Slow.' },
    ],
  }) });

  const out = await analyse('text', catalog, 'k');
  ok('an unknown catalog id is dropped rather than trusted',
     out.items[0].catalogId === '', `catalogId=${out.items[0].catalogId}`);

  const routine = toRoutine(out, 'vid123');
  ok('the movement survives as a custom exercise',
     routine.customExercises.length === 1 && routine.exercises.length === 1,
     JSON.stringify(routine.exercises));
  ok('its cue is kept as the instruction',
     routine.customExercises[0].instructions[0] === 'Slow.',
     JSON.stringify(routine.customExercises[0]));
  ok('the routine points back at the video',
     routine.source.videoId === 'vid123' && routine.source.kind === 'youtube',
     JSON.stringify(routine.source));
}

/* ── 7. "found" is not taken on trust ───────────────────────────────── */
{
  stub({ body: answer({
    found: true, name: 'Nothing here', notes: 'No exercises.',
    items: [{ kind: 'rest', name: 'Rest', seconds: 60, catalogId: '', cue: '' }],
  }) });

  const out = await analyse('text', catalog, 'k');
  ok('found=true with no exercises is corrected to false', out.found === false,
     `found=${out.found}`);
}

/* ── 8. Nonsense numbers are clamped ────────────────────────────────── */
{
  stub({ body: answer({
    found: true, name: 'X', notes: '',
    items: [
      { kind: 'exercise', name: 'Plank', seconds: -5, catalogId: 'Plank', cue: '' },
      { kind: 'exercise', name: 'Air Bike', seconds: 999999, catalogId: 'Air_Bike', cue: '' },
    ],
  }) });

  const out = await analyse('text', catalog, 'k');
  ok('a negative duration becomes 0', out.items[0].seconds === 0, `${out.items[0].seconds}`);
  ok('an absurd duration is capped', out.items[1].seconds === 3600, `${out.items[1].seconds}`);
}

/* ── 9. Rests are shown but never become exercises ──────────────────── */
{
  const result = {
    found: true, name: 'X', notes: '',
    items: [
      { kind: 'exercise', name: 'Crunches', seconds: 45, catalogId: 'Crunches', cue: '' },
      { kind: 'rest', name: 'Rest', seconds: 15, catalogId: '', cue: '' },
      { kind: 'exercise', name: 'Plank', seconds: 45, catalogId: 'Plank', cue: '' },
    ],
  };
  const routine = toRoutine(result, 'v');
  ok('rests are left out of the exercise list',
     routine.exercises.length === 2 && routine.exercises.join(',') === 'Crunches,Plank',
     routine.exercises.join(','));
  ok('the detected timing is kept on the record',
     routine.source.detected.length === 3,
     `${routine.source.detected.length}`);
}

/* ── 10. The suggested interval follows the video ───────────────────── */
{
  const mk = (secs) => secs.map((s) => ({ kind: 'exercise', seconds: s }));
  ok('45s video suggests 45', suggestedInterval(mk([45, 45, 40])) === 45);
  ok('30s video suggests 30', suggestedInterval(mk([30, 30, 25])) === 30);
  ok('a 20s video snaps to the nearer of the two', suggestedInterval(mk([20, 20])) === 30);
  ok('no timings means no suggestion', suggestedInterval(mk([0, 0])) === null);
  ok('rests do not count toward it',
     suggestedInterval([{ kind: 'rest', seconds: 45 }, { kind: 'exercise', seconds: 30 }]) === 30);
}

/* ── Report ─────────────────────────────────────────────────────────── */
const out = document.getElementById('out');
out.innerHTML = results.map((r) =>
  `<div class="${r.condition ? 'pass' : 'fail'}">${r.name}${r.condition || !r.detail ? '' : ` — ${r.detail}`}</div>`
).join('');

const failed = results.filter((r) => !r.condition).length;
document.getElementById('summary').textContent = failed
  ? `${failed} FAILED of ${results.length}`
  : `ALL PASS — ${results.length} assertions`;
</script>
</body>
</html>
